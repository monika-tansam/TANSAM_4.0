name: Chatbot indexing
on:
  push:
    paths: ['backend/**', '.github/workflows/chatbot-indexing.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/chatbot-indexing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m unittest discover -s backend/tests -v
  http-integration:
    runs-on: ubuntu-latest
    services:
      chroma:
        image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
        ports: ['18002:8000']
    env:
      TANSY_TEST_CHROMA_URL: http://127.0.0.1:18002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m unittest discover -s backend/tests -v
      - run: docker compose -f backend/compose.yaml --env-file backend/deploy.env.example config --quiet
